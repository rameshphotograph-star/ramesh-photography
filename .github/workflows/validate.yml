name: Validate Pages Functions
on:
  pull_request:
  push:
    branches:
      - feature/photo-delivery-platform
jobs:
  syntax-and-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Validate Pages routes configuration
        run: python -m json.tool _routes.json >/dev/null
      - name: Validate D1 migration and required schema
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript("""
          PRAGMA foreign_keys=ON;
          CREATE TABLE admins (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, email TEXT NOT NULL UNIQUE, password_hash TEXT NOT NULL, is_active INTEGER NOT NULL DEFAULT 1, created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP);
          CREATE TABLE events (id INTEGER PRIMARY KEY AUTOINCREMENT, event_name TEXT NOT NULL, event_type TEXT NOT NULL DEFAULT 'wedding', event_date TEXT, venue TEXT, event_code TEXT NOT NULL UNIQUE, status TEXT NOT NULL DEFAULT 'active', admin_id INTEGER NOT NULL, created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP, FOREIGN KEY(admin_id) REFERENCES admins(id));
          CREATE TABLE albums (id INTEGER PRIMARY KEY AUTOINCREMENT, event_id INTEGER NOT NULL, album_name TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP, FOREIGN KEY(event_id) REFERENCES events(id));
          CREATE TABLE photos (id INTEGER PRIMARY KEY AUTOINCREMENT, event_id INTEGER NOT NULL, album_id INTEGER, object_key TEXT NOT NULL UNIQUE, file_name TEXT NOT NULL, content_type TEXT, file_size INTEGER, uploaded_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP, FOREIGN KEY(event_id) REFERENCES events(id), FOREIGN KEY(album_id) REFERENCES albums(id));
          CREATE TABLE admin_sessions (id INTEGER PRIMARY KEY AUTOINCREMENT, admin_id INTEGER NOT NULL, token_hash TEXT NOT NULL UNIQUE, expires_at TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP, FOREIGN KEY(admin_id) REFERENCES admins(id));
          CREATE TABLE guest_sessions (id INTEGER PRIMARY KEY AUTOINCREMENT, event_id INTEGER NOT NULL, token_hash TEXT NOT NULL UNIQUE, expires_at TEXT NOT NULL, created_at TEXT NOT NULL DEFAULT CURRENT_TIMESTAMP, FOREIGN KEY(event_id) REFERENCES events(id));
          """)
          db.executescript(Path("migrations/0002_platform_support.sql").read_text())
          required = {
            "admins": {"id","name","email","password_hash","is_active"},
            "events": {"id","admin_id","event_name","event_type","event_date","venue","event_code","status","created_at"},
            "albums": {"id","event_id","album_name","created_at"},
            "photos": {"id","event_id","album_id","object_key","file_name","content_type","file_size","uploaded_at"},
            "admin_sessions": {"id","admin_id","token_hash","expires_at"},
            "login_attempts": {"id","ip_hash","attempted_at","success"},
            "photo_delivery_meta": {"photo_id","secure_url","resource_type","width","height","format","duration"}
          }
          for table, columns in required.items():
            actual = {r[1] for r in db.execute("PRAGMA table_info(" + table + ")")}
            assert columns <= actual, (table, columns - actual)
          db.execute("INSERT INTO admins(name,email,password_hash) VALUES('Test','test@example.com','hash')")
          db.execute("INSERT INTO events(event_name,event_code,admin_id) VALUES('Test Wedding','WED-TEST1',1)")
          db.execute("INSERT INTO photos(event_id,object_key,file_name) VALUES(1,'public-id','test.jpg')")
          db.execute("INSERT INTO photo_delivery_meta(photo_id,secure_url) VALUES(1,'https://res.cloudinary.com/demo/image/upload/test.jpg')")
          print("D1 migration and all required columns validated against the declared schema.")
          PY
