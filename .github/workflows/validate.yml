name: Validate Pages Functions
on:
  pull_request:
  push:
    branches:
      - feature/photo-delivery-platform
jobs:
  syntax-and-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test password hashing compatibility
        run: npm test
      - name: Validate Pages routes configuration
        run: python -m json.tool _routes.json >/dev/null
      - name: Validate fresh D1 migrations and existing database upgrade
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          required = {
            "admins": {"id","name","email","password_hash","is_active","created_at"},
            "events": {"id","admin_id","event_name","event_type","event_date","venue","event_code","status","created_at"},
            "albums": {"id","event_id","album_name","created_at"},
            "photos": {"id","event_id","album_id","object_key","file_name","content_type","file_size","uploaded_at"},
            "admin_sessions": {"id","admin_id","token_hash","expires_at","created_at"},
            "guest_sessions": {"id","event_id","token_hash","expires_at","created_at"},
            "login_attempts": {"id","ip_hash","attempted_at","success"},
            "photo_delivery_meta": {"photo_id","secure_url","resource_type","width","height","format","duration","created_at"}
          }

          def verify(db):
            for table, columns in required.items():
              actual = {r[1] for r in db.execute("PRAGMA table_info(" + table + ")")}
              assert columns <= actual, (table, columns - actual)
            db.execute("INSERT INTO admins(name,email,password_hash) VALUES('Test','test@example.com','hash')")
            db.execute("INSERT INTO events(event_name,event_code,admin_id) VALUES('Test Wedding','WED-TEST1',1)")
            db.execute("INSERT INTO photos(event_id,object_key,file_name) VALUES(1,'public-id','test.jpg')")
            db.execute("INSERT INTO photo_delivery_meta(photo_id,secure_url) VALUES(1,'https://res.cloudinary.com/demo/image/upload/test.jpg')")
            db.execute("INSERT INTO guest_sessions(event_id,token_hash,expires_at) VALUES(1,'guest-token','2099-01-01T00:00:00.000Z')")
            db.commit()

          # Fresh Preview database path.
          fresh = sqlite3.connect(":memory:")
          fresh.executescript(Path("migrations/0001_init.sql").read_text())
          fresh.executescript(Path("migrations/0002_platform_support.sql").read_text())
          verify(fresh)

          # Upgrade path: existing six-table database receives only support tables.
          existing = sqlite3.connect(":memory:")
          existing.executescript(Path("migrations/0001_init.sql").read_text())
          existing.executescript(Path("migrations/0002_platform_support.sql").read_text())
          verify(existing)

          # Idempotency: support migration can be reapplied safely.
          existing.executescript(Path("migrations/0002_platform_support.sql").read_text())
          print("Fresh D1 schema, support migration, required columns, inserts and idempotency validated.")
          PY
